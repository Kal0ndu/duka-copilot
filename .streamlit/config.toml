# Duka — Professional SME Finance Platform Theme
# Dark mode, trustworthy palette with warm Kenyan-inspired accents

[theme]
base = "dark"
primaryColor = "#F59E0B"             # Warm amber/gold — approachable, trustworthy
backgroundColor = "#0F172A"          # Deep slate
secondaryBackgroundColor = "#1E293B" # Slightly lighter slate
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"                # Light text
linkColor = "#60A5FA"
borderColor = "#334155"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"                   # Slightly softer rounding
buttonRadius = "8px"

# Typography — Inter for clean readability
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors
greenColor = "#34D399"  # Positive/gains
redColor = "#F87171"    # Negative/losses
yellowColor = "#FBBF24" # Warnings/caution
orangeColor = "#F59E0B" # Alerts — matches primary
blueColor = "#60A5FA"   # Informational
violetColor = "#A78BFA" # Accent
grayColor = "#94A3B8"   # Neutral/secondary text

# Chart colors — the categorical palette validated (dataviz checker) on the
# dark surface #0F172A: lightness band, chroma, colour-blind and normal-vision
# separation, 3:1 contrast. Order matters: money in, money out, net, ...
chartCategoricalColors = [
    "#3987e5",
    "#d95926",
    "#199e70",
    "#c98500",
    "#d55181",
    "#008300",
    "#9085e9",
    "#e66767",
]

# Sequential colors — one hue (blue), dark to light on the dark surface
chartSequentialColors = [
    "#0d366b",
    "#104281",
    "#184f95",
    "#1c5cab",
    "#256abf",
    "#2a78d6",
    "#3987e5",
    "#5598e7",
    "#6da7ec",
    "#86b6ef",
]

# Dataframe styling
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"
dataframeHeaderTextColor = "#F8FAFC"

# Sidebar — slightly darker for contrast
[theme.sidebar]
backgroundColor = "#0B1320"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
primaryColor = "#F59E0B"
